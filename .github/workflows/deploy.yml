name: Deploy Lovable via FTP na Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v3

      - name: Configurar Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependências
        run: npm install

      - name: Instalar Chromium para prerender
        run: npx playwright install --with-deps chromium

      - name: Build do projeto (com prerender SSG)
        run: npm run build

      - name: Mostrar arquivos gerados
        run: ls -la dist/

      - name: Deploy FTP para Hostinger (incremental — sem apagar tudo)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          port: 21
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/
          server-dir: /
          # IMPORTANTE: NÃO usar dangerous-clean-slate.
          # A action compara os arquivos e faz upload incremental,
          # mantendo chunks JS antigos disponíveis para usuários com HTML em cache
          # durante a janela de deploy (evita tela branca / imagens quebradas no 1º load).
          dangerous-clean-slate: false
          dry-run: false
          log-level: verbose
          # Preserva pastas/arquivos que não fazem parte do build (ex.: .well-known, uploads manuais)
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
